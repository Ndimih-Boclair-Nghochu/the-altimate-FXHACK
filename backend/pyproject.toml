[project]
name = "fxbot"
dynamic = ["version"]
description = "Altimate FX: algorithmic forex trading backend (broker adapters, strategies, risk, learning, API)."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "structlog>=24.4",
]

[project.scripts]
fxbot = "fxbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fxbot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fxbot"]

[tool.uv]
default-groups = ["dev"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and fake credentials that bandit mistakes for hardcoded secrets.
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["fxbot"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "joblib", "joblib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov=fxbot", "--cov-report=term-missing:skip-covered"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage

[tool.coverage.run]
source = ["fxbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(typing\\.)?overload",
    "^\\s*\\.\\.\\.$",
]
