# Altimate FX dashboard — nginx server config.
#
# Runs in nginxinc/nginx-unprivileged (non-root, port 8080). Installed as
# /etc/nginx/conf.d/default.conf, so it is included inside the http {} block.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1m;

    # Resolve the backend at request time through Docker's embedded DNS, so this
    # container starts (and serves the UI) even before the backend is up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers -----------------------------------------------------
    # Declared once at server level and inherited by every location below (no
    # location uses add_header, which would silently drop these).
    # Keep the CSP in sync with `preview.headers` in vite.config.ts.
    #  - No inline script/style: the theme pre-paint script is an external file and
    #    the chart library's inline attribution <style> is disabled in code.
    #  - connect-src 'self' covers same-origin ws:/wss: (CSP Level 3).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Enable when served over HTTPS (e.g. behind a TLS-terminating proxy):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- Backend REST API -----------------------------------------------------
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- Backend WebSocket stream --------------------------------------------
    location ^~ /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- Static files ---------------------------------------------------------
    # Content-hashed build output: cache for a year.
    location ^~ /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Container health probe.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: client-side routes get index.html. Never cache it (or the other
    # un-hashed files) so a new deploy is picked up immediately.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
